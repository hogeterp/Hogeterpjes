name: Check Firebase connection (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/firebase-connection-check.yml
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'hogeterp/Hogeterpjes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud without a private key
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hogeterpjes
          workload_identity_provider: projects/225365940920/locations/global/workloadIdentityPools/github-hogeterpjes/providers/github-actions
          service_account: codex-hogeterpjes-rules@hogeterpjes.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 300s
      - name: Check read access to Firebase Rules
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --output /dev/null \
            'https://firebaserules.googleapis.com/v1/projects/hogeterpjes/releases?pageSize=1'
          echo 'Firebase authentication and Rules read access succeeded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No rules or database records were changed.' >> "$GITHUB_STEP_SUMMARY"
