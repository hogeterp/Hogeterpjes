name: Test, inspect or publish approved Firebase rules
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - scripts/firebase_rules_release.py
      - tests/firebase/**
      - .github/workflows/firebase-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - storage.rules
      - scripts/firebase_rules_release.py
      - tests/firebase/**
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect reads only; publish changes the selected live security rules'
        type: choice
        options: [inspect, publish]
        default: inspect
        required: true
      target:
        description: 'Rules to inspect or publish'
        type: choice
        options: [firestore, storage]
        default: firestore
        required: true
      expected_rules_sha256:
        description: 'Publish only: exact reviewed rules SHA256 from inspection'
        type: string
        required: false
      expected_live_ruleset:
        description: 'Publish only: live ruleset name from inspection'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: hogeterpjes-rules-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test publication safeguards without credentials
        run: python3 tests/firebase/release_test.py
      - name: Install isolated emulator test dependencies
        working-directory: tests/firebase
        run: npm ci --no-audit --no-fund
      - name: Test Firestore and Storage with synthetic demo data
        working-directory: tests/firebase
        run: npm test
  inspect:
    needs: tests
    if: github.repository == 'hogeterp/Hogeterpjes' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.mode != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [firestore, storage]
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate using repository-scoped federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hogeterpjes
          workload_identity_provider: projects/225365940920/locations/global/workloadIdentityPools/github-hogeterpjes/providers/github-actions
          service_account: codex-hogeterpjes-rules@hogeterpjes.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 300s
      - name: Inspect live rules without changing them
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_MODE: inspect
          RULES_TARGET: ${{ matrix.target }}
        run: python3 scripts/firebase_rules_release.py
  publish:
    needs: tests
    if: github.repository == 'hogeterp/Hogeterpjes' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate using repository-scoped federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hogeterpjes
          workload_identity_provider: projects/225365940920/locations/global/workloadIdentityPools/github-hogeterpjes/providers/github-actions
          service_account: codex-hogeterpjes-rules@hogeterpjes.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 300s
      - name: Publish only the exact reviewed file against the reviewed live release
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_MODE: publish
          RULES_TARGET: ${{ inputs.target }}
          EXPECTED_RULES_SHA256: ${{ inputs.expected_rules_sha256 }}
          EXPECTED_LIVE_RULESET: ${{ inputs.expected_live_ruleset }}
        run: python3 scripts/firebase_rules_release.py
