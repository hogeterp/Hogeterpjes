# Proposal only: not installed or executed. Remove after verified publication.
# Fixed approved rules hash and prior release prevent future rules being published.
name: Publish reviewed wish rules once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-wish-rules-once.yml
permissions:
  contents: read
concurrency:
  group: hogeterpjes-rules-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test publication safeguards without credentials
        run: python3 tests/firebase/release_test.py
      - name: Test purchase listener isolation and logout
        run: node tests/app/wish-purchases-state.cjs
      - name: Install isolated emulator test dependencies
        working-directory: tests/firebase
        run: npm ci --no-audit --no-fund
      - name: Test Firestore and Storage with synthetic demo data
        working-directory: tests/firebase
        run: npm test
  publish:
    needs: tests
    if: github.repository == 'hogeterp/Hogeterpjes' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate using repository-scoped federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hogeterpjes
          workload_identity_provider: projects/225365940920/locations/global/workloadIdentityPools/github-hogeterpjes/providers/github-actions
          service_account: codex-hogeterpjes-rules@hogeterpjes.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 300s
      - name: Publish only the exact reviewed file against the reviewed live release
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_MODE: publish
          RULES_TARGET: firestore
          EXPECTED_RULES_SHA256: e3484d9abaf460e0c8b3f53029dc1f54fca0e239eff1c6532a99fec0106560d4
          EXPECTED_LIVE_RULESET: projects/hogeterpjes/rulesets/aaf3844c-df76-4ac8-8ae0-17af487214bf
        run: python3 scripts/firebase_rules_release.py
