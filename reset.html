<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b3a"><title>Wachtwoord herstellen · Wildenhorst</title><link rel="stylesheet" href="style.css?v=1.40"><style>body{padding:20px 12px}.reset-wrap{max-width:440px;margin:30px auto}.reset-card{background:#fff;border:1px solid #dbe4df;border-radius:22px;padding:26px;box-shadow:0 10px 36px #123b2420}.reset-logo{width:108px;height:108px;display:block;margin:0 auto 15px;border-radius:23px}.reset-card h1{text-align:center;font-size:1.5rem;color:#126b3a}.reset-card p{line-height:1.5;color:#52665a}.reset-card button{width:100%;margin-top:18px}.reset-card a{color:#126b3a}.reset-card .message{margin-top:14px}</style></head><body><main class="reset-wrap"><section class="reset-card"><img class="reset-logo" src="club-logo.png" alt="Wildenhorst"><h1>Wachtwoord herstellen</h1><p>Stel een wachtwoord in voor je Wildenhorst-account. Je mag je vorige wachtwoord opnieuw proberen, als Firebase het accepteert.</p><form id="resetForm"><label for="newPassword">Wachtwoord</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" required><label for="confirmPassword">Herhaal wachtwoord</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button id="saveButton" type="submit">Wachtwoord opslaan</button></form><div id="result" class="message hidden" role="status"></div><p><a href="./">Terug naar inloggen</a></p></section></main><script src="firebase-config.js?v=1.40"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,verifyPasswordResetCode,confirmPasswordReset}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const params=new URLSearchParams(location.search),code=params.get('oobCode'),mode=params.get('mode'),result=document.getElementById('result'),form=document.getElementById('resetForm'),btn=document.getElementById('saveButton');function message(t,error=false){result.textContent=t;result.className='message'+(error?' error':'')}const cfg=window.WILDENHORST_FIREBASE;if(!cfg?.configured||mode!=='resetPassword'||!code){form.hidden=true;message('Deze herstellink is niet geldig. Vraag een nieuwe e-mail aan via de inlogpagina.',true)}else{const auth=getAuth(initializeApp(cfg));verifyPasswordResetCode(auth,code).catch(()=>{form.hidden=true;message('Deze herstellink is verlopen of al gebruikt. Vraag een nieuwe aan.',true)});form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){message('De wachtwoorden komen niet overeen.',true);return}btn.disabled=true;try{await confirmPasswordReset(auth,code,a);form.hidden=true;message('Je wachtwoord is opgeslagen. Je kunt nu inloggen.')}catch(e){message('Opslaan is niet gelukt. Mogelijk is de link verlopen. Vraag een nieuwe herstellink aan.',true)}finally{btn.disabled=false}})}</script></body></html>
